name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI is the unified PURE-PYTHON gate: lint + research unit tests only.
# It never installs torch, never loads weights, and never runs / samples the
# model. Model sampling, evaluation and weight fetching run on the server
# (see scripts/ and requirements.lock), not in CI.

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.4" "black>=24.0"
      - name: ruff check
        run: ruff check .
      - name: black --check
        run: black --check .

  test:
    name: Pure-Python tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pure-Python test deps (no torch / no model)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: Run pure-Python unit tests
        # Torch-dependent upstream smoke tests are auto-skipped by conftest.py
        # when torch is absent; only the research/ generators, validators and
        # metrics tests run here. The model is never imported or executed.
        run: pytest -q

  build:
    name: Build sdist / wheel
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
