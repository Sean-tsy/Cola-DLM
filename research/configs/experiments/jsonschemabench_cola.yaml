# env节九 9.5 · L1 JSONSchemaBench baseline (server HF dataset ingestion).
run_id: jsonschemabench_cola
task: structured
n_samples: 512
seeds: [1234, 2025, 3407]

# name=Github_easy：default 混档含 Kubernetes/JsonSchemaStore 巨型 schema，
# 全文入 prompt 会把 VAE prefix attention 撑到 OOM；L1 基线用 easy 档。
data:
  source: jsonschemabench
  name: Github_easy
  split: test

sampling:
  block_size: 16
  timestep_num: 16
  guidance_scale: 7.0
  max_new_tokens: 256
  temperature: 0.0
  trace: true

checkpoint:
  dit: ${DIT_PATH}
  vae: ${VAE_PATH}
  tokenizer: ${TOKENIZER_PATH}
